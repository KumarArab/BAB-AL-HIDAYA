name: Deploy preview to GitHub Pages

on:
  push:
    branches: [develop, claude/beautiful-thompson-7w5tpj]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx astro check

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://arabkumar.in
          BASE_PATH: /${{ github.event.repository.name }}

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
